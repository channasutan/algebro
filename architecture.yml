version: 1
components:
  - name: app
    paths:
      - app/**
  - name: infrastructure
    paths:
      - infrastructure/**
  - name: events
    paths:
      - events/**
    constraint: in-process-only
    note: "EventBus is a synchronous in-process emitter. Replace with a queue (e.g. BullMQ) for cross-process needs."
  - name: jobs
    paths:
      - jobs/**
  - name: config
    paths:
      - config/**
  - name: modules
    paths:
      - modules/**
  - name: module-repositories
    paths:
      - modules/**/repositories/**
  - name: module-non-repositories
    paths:
      - modules/**/contracts/**
      - modules/**/domain/**
      - modules/**/events/**
      - modules/**/services/**
      - modules/**/tests/**
      - modules/**/index.ts
  - name: supabase-clients
    paths:
      - lib/supabase/**
  - name: lib
    paths:
      - lib/**
  - name: repositories
    paths:
      - repositories/**
  - name: tests
    paths:
      - tests/**
  - name: services
    paths:
      - services/**
directives:
  - name: "Infrastructure isolation"
    constraint: "infrastructure -> modules"
    action: forbid
  - name: "App cannot import Supabase clients"
    constraint: "app -> supabase-clients"
    action: forbid
  - name: "Infrastructure cannot import Supabase clients"
    constraint: "infrastructure -> supabase-clients"
    action: forbid
  - name: "Events cannot import Supabase clients"
    constraint: "events -> supabase-clients"
    action: forbid
  - name: "Jobs cannot import Supabase clients"
    constraint: "jobs -> supabase-clients"
    action: forbid
  - name: "Events isolation"
    constraint: "events -> modules"
    action: forbid
  - name: "Config isolation"
    constraint: "config -> modules"
    action: forbid
  - name: "App can read configuration"
    constraint: "app -> config"
    action: allow
  - name: "Modules can read configuration"
    constraint: "modules -> config"
    action: allow
  - name: "Module repositories can read configuration"
    constraint: "module-repositories -> config"
    action: allow
  - name: "Module non-repositories can read configuration"
    constraint: "module-non-repositories -> config"
    action: allow
  - name: "Infrastructure can read configuration"
    constraint: "infrastructure -> config"
    action: allow
  - name: "Jobs can read configuration"
    constraint: "jobs -> config"
    action: allow
  - name: "Config cannot import Supabase clients"
    constraint: "config -> supabase-clients"
    action: forbid
  - name: "Modules cannot depend on infrastructure"
    constraint: "modules -> infrastructure"
    action: forbid
  - name: "Modules can access shared lib"
    constraint: "modules -> lib"
    action: allow
  - name: "App cannot depend on infrastructure"
    constraint: "app -> infrastructure"
    action: forbid
  - name: "Internal module isolation"
    constraint: "modules -> modules"
    action: forbid
  - name: "Non-repository module files cannot import Supabase clients"
    constraint: "module-non-repositories -> supabase-clients"
    action: forbid
  - name: "Tests can access Supabase clients"
    constraint: "tests -> supabase-clients"
    action: allow
  - name: "Tests can access infrastructure"
    constraint: "tests -> infrastructure"
    action: allow
  - name: "Tests can access modules"
    constraint: "tests -> modules"
    action: allow
  - name: "Modules can access event registry"
    constraint: "modules -> events"
    action: allow
  - name: "Tests can access events"
    constraint: "tests -> events"
    action: allow
  - name: "Repositories can access Supabase clients"
    constraint: "repositories -> supabase-clients"
    action: allow
  - name: "App can access repositories"
    constraint: "app -> repositories"
    action: allow
  - name: "Modules can access repositories"
    constraint: "modules -> repositories"
    action: allow
  - name: "App cannot access modules"
    constraint: "app -> modules"
    action: forbid
  - name: "App can access lib utilities"
    constraint: "app -> lib"
    action: allow
  - name: "App can access services"
    constraint: "app -> services"
    action: allow
  - name: "Services can access modules"
    constraint: "services -> modules"
    action: allow
  - name: "Services can access lib"
    constraint: "services -> lib"
    action: allow
  - name: "Services can access repositories"
    constraint: "services -> repositories"
    action: allow
  - name: "Services can access Supabase clients"
    constraint: "services -> supabase-clients"
    action: allow
