version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: npm ci

      - run:
          name: Build project
          command: npm run build

      - run:
          name: SonarCloud Scan
          command: |
            curl -sSLo /tmp/sonar-scanner.zip \
              https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
            unzip -q /tmp/sonar-scanner.zip -d /tmp/sonar
            /tmp/sonar/sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner \
              -Dsonar.token=$SONAR_TOKEN

workflows:
  main:
    jobs:
      - build:
          context: SonarCloud
