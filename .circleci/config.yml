version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@2.0.0

jobs:
  validate:
    docker:
      - image: cimg/node:24.0.0

    steps:
      - checkout

      - run:
          name: Fetch full git history
          command: |
            git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
            git fetch --no-filter --refetch || true
            git fetch --unshallow || true
            git fetch --all
            git fetch --tags

      - run:
          name: Install dependencies
          command: npx pnpm@9 install --frozen-lockfile

      - run:
          name: Run type-check
          command: npx pnpm@9 run type-check

      - run:
          name: Run tests
          command: npx pnpm@9 test

      - run:
          name: Run lint
          command: npx pnpm@9 run lint

      - run:
          name: Build project
          command: npx pnpm@9 run build

      - sonarcloud/scan

workflows:
  validate_project:
    jobs:
      - validate:
          context: SonarCloud
