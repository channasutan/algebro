version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@2.0.0

jobs:
  validate:
    docker:
      - image: cimg/node:22.11

    steps:
      - checkout

      # Fix SonarCloud MissingObjectException caused by shallow clone
      - run:
          name: Fetch full git history
          command: git fetch --unshallow || true

      # Install dependencies
      - run:
          name: Install dependencies
          command: npm ci

      # Run tests
      - run:
          name: Run tests
          command: npm run test

      # Run lint
      - run:
          name: Run lint
          command: npm run lint

      # Build project
      - run:
          name: Build project
          command: npm run build

      # SonarCloud analysis
      - sonarcloud/scan

workflows:
  validate_project:
    jobs:
      - validate:
          context: SonarCloud