version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@2.0.0

jobs:
  validate:
    docker:
      - image: cimg/node:22.11

    steps:
      - checkout
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - sonarcloud/scan

workflows:
  validate_project:
    jobs:
      - validate:
          context: SonarCloud